groups:
  - name: http
    labels:
      team: chat
    rules:
    - alert: HighRequestLatency
      expr: histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket[5m])) by (le, job)) > 1
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "High latency detected (p95 > 1s)"
