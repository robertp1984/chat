name: springboot-practice
services:
  postgresql:
    image: postgres:18.0
    hostname: postgresql
    volumes:
      - data-postgresql:/var/lib/postgresql/18/docker
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
      - POSTGRES_HOST_AUTH_METHOD=scram-sha-256
    restart: no
    ports:
      - "5432:5432"

  chat:
    build:
      context: ./chat
      tags:
        - chat:0.0.1
        - robertp22/chat:0.0.1
    hostname: chat
    restart: no
    ports:
      - "8090:8080"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - API_NINJAS_API_KEY=${API_NINJAS_API_KEY}
    depends_on:
      - redis

  redis:
    image: redis:8.8.0
    hostname: redis
    ports:
      - "6379:6379"
    volumes:
      - data-redis:/data
    environment:
      - REDIS_ARGS=--requirepass redispwd --appendonly yes
    restart: no


volumes:
  data-postgres:
  data-redis:
