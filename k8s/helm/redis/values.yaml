auth:
  enabled: true
  existingSecret: secrets
  existingSecretPasswordKey: redis-password

architecture: replication

master:
  persistence:
    enabled: true
    size: 1Gi
  resources:
    requests:
      cpu: 500m
      memory: 64M
    limits:
      cpu: 500m
      memory: 128M

replica:
  replicaCount: 2
  persistence:
    enabled: true
    size: 1Gi
  resources:
    requests:
      cpu: 500m
      memory: 64M
    limits:
      cpu: 500m
      memory: 128M

volumePermissions:
  enabled: true
